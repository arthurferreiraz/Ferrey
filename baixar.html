<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Baixar — Ferrey</title>
<meta name="description" content="Baixe o Ferrey na App Store. Disponível gratuitamente para iPhone.">
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  if (p.get('from') === 'ad' && /iPhone/i.test(navigator.userAgent)) {
    window.location.replace('https://apps.apple.com/br/app/ferrey-tons-e-efeitos/id6749463038');
  }
}());
</script>
<style>

@font-face {
  font-family: 'Druk Text Wide Trial';
  src: local('Druk Text Wide Trial Bold'), local('DrukTextWide-Bold');
  font-weight: 700;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  background: #aabac6;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 28% 18%, rgba(215,200,175,.65) 0%, transparent 50%),
    radial-gradient(ellipse at 72% 78%, rgba(160,182,200,.58) 0%, transparent 48%),
    radial-gradient(ellipse at 55% 45%, rgba(192,180,165,.4)  0%, transparent 55%),
    linear-gradient(155deg, #d2c3ae 0%, #bac9d5 42%, #c9c1b2 68%, #aabac6 100%);
}
.bg::before {
  content: '';
  position: absolute;
  top: -8%; left: 8%;
  width: 58%; height: 48%;
  background: radial-gradient(ellipse, rgba(255,248,230,.48) 0%, transparent 70%);
}

/* ── LAYOUT ───────────────────────────────────────── */
.scene {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

/* ── CARD ─────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 300px;
  background: rgba(255, 253, 250, .22);
  backdrop-filter: blur(32px) saturate(1.5) brightness(1.05);
  -webkit-backdrop-filter: blur(32px) saturate(1.5) brightness(1.05);
  border: .5px solid rgba(255, 255, 255, .52);
  border-radius: 36px;
  padding: 2.5rem 2.25rem 2.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(18px);
  animation: rise .85s cubic-bezier(.22, 1, .36, 1) .15s forwards;
}

.app-icon {
  width: 80px; height: 80px;
  border-radius: 20px;
  background: rgba(255, 255, 255, .8);
  border: .5px solid rgba(255, 255, 255, .65);
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1.5rem;
  flex-shrink: 0;
}
.app-icon img { width: 48px; height: 48px; object-fit: contain; }

.app-title {
  font-family: 'Druk Text Wide Trial', 'Arial Black', Arial, sans-serif;
  font-weight: 900;
  font-size: 2.2rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: rgba(18, 14, 10, .86);
  line-height: 1;
  margin-bottom: .5rem;
}

.app-sub {
  font-size: 10px;
  color: rgba(18, 14, 10, .35);
  letter-spacing: .22em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

.btn-store {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(18, 14, 10, .88);
  color: rgba(255, 252, 248, .92);
  text-decoration: none;
  padding: 1rem 1.5rem;
  border-radius: 100px;
  width: 100%;
  border: .5px solid rgba(255,255,255,.1);
  transition: transform .15s, background .2s;
  margin-bottom: .85rem;
}
.btn-store:hover  { background: rgba(18,14,10,.96); }
.btn-store:active { transform: scale(.97); }
.btn-store img { width: 18px; height: 18px; flex-shrink: 0; }

.btn-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; }
.btn-label small { font-size: 9px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
.btn-label span  { font-size: 14px; font-weight: 700; letter-spacing: .01em; }

.note {
  font-size: 10px;
  color: rgba(18, 14, 10, .26);
  letter-spacing: .06em;
}

/* ── BACK LINK ────────────────────────────────────── */
.back-link {
  position: fixed;
  bottom: max(1.75rem, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  text-decoration: none;
  color: rgba(18, 14, 10, .3);
  white-space: nowrap;
  opacity: 0;
  animation: rise .6s ease .7s forwards;
  transition: color .2s;
}
.back-link:hover { color: rgba(18, 14, 10, .6); }

@keyframes rise { to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (min-height: 700px) {
  .app-icon { width: 88px; height: 88px; border-radius: 22px; }
  .app-icon img { width: 54px; height: 54px; }
  .app-title { font-size: 2.4rem; }
  .card { padding: 2.75rem 2.5rem 2.5rem; max-width: 320px; }
}

</style>
</head>
<body>

<div class="bg"></div>

<div class="scene">
  <div class="card">
    <div class="app-icon">
      <img src="logo.png" alt="Ferrey">
    </div>

    <h1 class="app-title">Ferrey</h1>
    <p class="app-sub">Film Camera · iPhone</p>

    <a class="btn-store" href="https://apps.apple.com/br/app/ferrey-tons-e-efeitos/id6749463038" target="_blank" rel="noopener">
      <img src="apple.png" alt="Apple">
      <div class="btn-label">
        <small>Baixar na</small>
        <span>App Store</span>
      </div>
    </a>

    <p class="note">Grátis · Disponível para iPhone</p>
  </div>
</div>

<a href="/" class="back-link">← Voltar ao site</a>

</body>
</html>
