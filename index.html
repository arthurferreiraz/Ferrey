<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ferrey — Tons e Efeitos</title>
<meta name="description" content="Transforme suas fotos com tons e efeitos únicos. Disponível para iPhone.">
<style>
@font-face {
  font-family: 'Druk Text Wide Trial';
  src: local('Druk Text Wide Trial Bold'), local('DrukTextWide-Bold');
  font-weight: 700;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 28% 18%, rgba(215,200,175,.65) 0%, transparent 50%),
    radial-gradient(ellipse at 72% 78%, rgba(160,182,200,.58) 0%, transparent 48%),
    radial-gradient(ellipse at 55% 45%, rgba(192,180,165,.4) 0%, transparent 55%),
    linear-gradient(155deg, #d2c3ae 0%, #bac9d5 42%, #c9c1b2 68%, #aabac6 100%);
  z-index: 0;
}

.bg::before {
  content: '';
  position: absolute;
  top: -8%;
  left: 8%;
  width: 58%;
  height: 48%;
  background: radial-gradient(ellipse, rgba(255,248,230,.48) 0%, transparent 70%);
  z-index: 1;
}

.scene {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

.card {
  width: 100%;
  max-width: 310px;
  background: rgba(255, 253, 250, 0.2);
  backdrop-filter: blur(32px) saturate(1.5) brightness(1.05);
  -webkit-backdrop-filter: blur(32px) saturate(1.5) brightness(1.05);
  border: 0.5px solid rgba(255, 255, 255, 0.5);
  border-radius: 36px;
  padding: 0 2.25rem 2.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}

.circle-wrap {
  margin-top: -60px;
  margin-bottom: 1.85rem;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 0.5px solid rgba(255, 255, 255, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 2px 24px rgba(0,0,0,0.06);
}

.circle-wrap img {
  width: 70px;
  height: 70px;
  object-fit: contain;
}

.app-title {
  font-family: 'Druk Text Wide Trial', 'Arial Black', Arial, sans-serif;
  font-weight: 900;
  font-size: 1.75rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(18, 14, 10, 0.86);
  line-height: 1;
  margin-bottom: 0.6rem;
}

.app-subtitle {
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: rgba(30, 22, 14, 0.62);
  letter-spacing: 0.04em;
  margin-bottom: 0.35rem;
}

.app-platform {
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(30, 22, 14, 0.36);
  margin-bottom: 1.85rem;
}

.divider {
  width: 3.5px;
  height: 3.5px;
  border-radius: 50%;
  background: rgba(30, 22, 14, 0.2);
  margin: 0 auto 1.85rem;
}

.btn-store {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  background: rgba(20, 16, 12, 0.86);
  color: rgba(255, 252, 248, 0.92);
  text-decoration: none;
  padding: 1.05rem 1.5rem;
  border-radius: 100px;
  width: 100%;
  transition: transform 0.15s, background 0.2s;
  border: 0.5px solid rgba(255,255,255,0.1);
}

.btn-store:active {
  transform: scale(0.97);
  background: rgba(20, 16, 12, 0.96);
}

.btn-store svg {
  width: 19px;
  height: 19px;
  fill: rgba(255, 252, 248, 0.9);
  flex-shrink: 0;
}

.btn-label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1.3;
}

.btn-label small {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.55;
}

.btn-label span {
  font-family: Arial, sans-serif;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.footer-note {
  margin-top: 1rem;
  font-family: Arial, sans-serif;
  font-size: 10px;
  color: rgba(30, 22, 14, 0.3);
  letter-spacing: 0.04em;
}

@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}

@media (min-height: 720px) {
  .circle-wrap { width: 132px; height: 132px; margin-top: -66px; }
  .circle-wrap img { width: 78px; height: 78px; }
  .card { max-width: 320px; padding: 0 2.5rem 2.75rem; }
  .app-title { font-size: 1.95rem; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="scene">
  <div class="card">
    <div class="circle-wrap">
      <img src="logo.png" alt="Ferrey">
    </div>

    <h1 class="app-title">Ferrey</h1>
    <p class="app-subtitle">Tons e Efeitos</p>
    <p class="app-platform">iOS</p>

    <div class="divider"></div>

    <a class="btn-store" href="https://apps.apple.com/br/app/ferrey-tons-e-efeitos/id6749463038">
      <img src="apple.png" alt="Apple" style="width:19px;height:19px;">
      <div class="btn-label">
        <small>Baixar na</small>
        <span>App Store</span>
      </div>
    </a>

    <p class="footer-note">Grátis · Disponível para iPhone</p>
  </div>
</div>

</body>
</html>
